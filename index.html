<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06101c">
<title>ALPINE RUSH 3D</title>
<style>
/* =====================================================================
   2. CSS DESIGN SYSTEM  (no external fonts / assets - system fonts only)
   ===================================================================== */
:root{--bg:#06101c;--c1:#22d3ff;--c2:#ff8a1f;--ink:#eaf6ff;--mut:#8aa6c1;--pan:rgba(7,18,33,.82);--pan2:rgba(16,40,68,.72);--ln:rgba(150,205,255,.22);--ok:#3ddc84;--bad:#ff4d5e;--gold:#ffd24a;--sil:#d3e0ec;--bro:#d98b4e;
--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--bs:clamp(54px,14vmin,86px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overscroll-behavior:none;touch-action:none;position:fixed;inset:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:#0a1626}
svg.ic{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
/* fx overlays */
#fxv{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,8,20,.55) 100%);z-index:2}
#fxl{position:fixed;inset:-25%;pointer-events:none;z-index:2;opacity:0;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,0) 0deg 5deg,rgba(255,255,255,.55) 5.4deg 5.8deg,rgba(255,255,255,0) 6.2deg 11deg);-webkit-mask-image:radial-gradient(circle,transparent 38%,#000 85%);mask-image:radial-gradient(circle,transparent 38%,#000 85%);will-change:opacity}
#fxf{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:#fff;transition:opacity .35s}
#fade{position:fixed;inset:0;background:#030a14;z-index:60;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1;pointer-events:auto}
/* HUD */
#hud{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
#hud.on{display:block}
#hud>*{position:absolute}
#hPos{left:calc(var(--sl) + 14px);top:calc(var(--sa) + 10px);font-weight:900;font-style:italic;font-size:clamp(30px,8vmin,54px);line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#hPos span{font-size:.5em;color:var(--mut)}
#hTop{left:50%;transform:translateX(-50%);top:calc(var(--sa) + 8px);text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.7)}
#hTime{font-weight:900;font-size:clamp(24px,6.4vmin,42px);font-variant-numeric:tabular-nums;letter-spacing:1px}
#hSub{font-size:clamp(11px,2.4vmin,15px);color:var(--c1);font-weight:700;letter-spacing:1px;text-transform:uppercase}
#hScore{left:calc(var(--sl) + 14px);top:calc(var(--sa) + 14vmin);text-shadow:0 2px 10px rgba(0,0,0,.7)}
#hScoreN{font-weight:900;font-size:clamp(16px,4vmin,26px);color:var(--gold);font-variant-numeric:tabular-nums}
#hCombo{font-weight:900;font-style:italic;color:var(--c2);font-size:clamp(13px,3vmin,20px);min-height:1em}
#hBtns{right:calc(var(--sr) + 12px);top:calc(var(--sa) + 10px);display:flex;gap:8px;pointer-events:auto}
.ib{width:clamp(38px,8vmin,50px);height:clamp(38px,8vmin,50px);border-radius:12px;background:rgba(8,22,40,.6);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:20px;touch-action:none}
.ib:active{background:rgba(34,211,255,.4)}
#hProg{left:50%;transform:translateX(-50%);top:calc(var(--sa) + 8px + clamp(36px,9vmin,58px));width:min(46vw,380px);height:7px;border-radius:5px;background:rgba(0,0,0,.45);border:1px solid var(--ln)}
#hProgF{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:linear-gradient(90deg,var(--c1),#8affc1)}
#hProg b{position:absolute;top:-3px;width:11px;height:11px;margin-left:-5px;border-radius:50%;background:#aab;border:2px solid #123}
#hProg b.me{background:var(--c2);width:15px;height:15px;top:-5px;margin-left:-7px;z-index:2;border-color:#fff}
#hGauge{left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 4px);width:clamp(96px,23vmin,160px);height:auto}
#hLives{left:calc(var(--sl) + 14px);top:calc(var(--sa) + 22vmin);font-size:22px;color:var(--bad);letter-spacing:3px}
#hMsg{left:50%;top:26%;transform:translateX(-50%);font-weight:900;font-style:italic;font-size:clamp(20px,5.6vmin,40px);text-shadow:0 3px 14px rgba(0,0,0,.7);white-space:nowrap;opacity:0}
#hMsg.pop{animation:pop 1.1s ease-out}
#hTrick{left:50%;top:36%;transform:translateX(-50%);font-weight:900;font-style:italic;font-size:clamp(16px,4.4vmin,30px);color:var(--gold);text-shadow:0 3px 12px rgba(0,0,0,.7);white-space:nowrap;opacity:0;text-align:center}
#hTrick.pop{animation:pop 1.8s ease-out}
#hCount{left:50%;top:40%;transform:translate(-50%,-50%);font-weight:900;font-style:italic;font-size:clamp(70px,24vmin,200px);text-shadow:0 6px 30px rgba(0,0,0,.6);color:#fff;opacity:0}
#hCount.pop{animation:cnt .95s ease-out}
#hHint{left:50%;bottom:calc(var(--sb) + 28vmin);transform:translateX(-50%);max-width:80vw;text-align:center;font-weight:800;font-size:clamp(13px,3vmin,20px);background:rgba(6,20,36,.72);border:1px solid var(--c1);border-radius:12px;padding:8px 16px;display:none}
#hWarn{left:50%;top:calc(var(--sa) + 16vmin);transform:translateX(-50%);font-weight:900;color:var(--bad);font-size:clamp(13px,3vmin,20px);letter-spacing:2px;display:none;animation:blink .5s infinite alternate}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.6)}15%{opacity:1;transform:translateX(-50%) scale(1.1)}30%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-18px)}}
@keyframes cnt{0%{opacity:0;transform:translate(-50%,-50%) scale(2)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
@keyframes blink{from{opacity:.35}to{opacity:1}}
/* touch controls */
#touch{position:fixed;inset:0;z-index:5;pointer-events:none;display:none}
#touch.on{display:block}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;width:var(--bs);height:var(--bs);background:rgba(8,26,46,.5);border:2px solid rgba(160,220,255,.4);color:#fff;font-weight:900;font-size:clamp(9px,2.2vmin,13px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;letter-spacing:.5px}
.tb svg.ic{width:1.9em;height:1.9em}
.tb.dn{background:rgba(34,211,255,.55);transform:scale(.93);border-color:#fff}
#tcS{position:absolute;left:calc(var(--sl) + 14px);bottom:calc(var(--sb) + 14px);width:calc(var(--bs)*2 + 14px);height:calc(var(--bs)*1.2)}
#tcS .tb{position:absolute;bottom:0;width:var(--bs);height:calc(var(--bs)*1.15);border-radius:22px}
#tL{left:0}#tR{right:0}
#tcA{position:absolute;right:calc(var(--sr) + 14px);bottom:calc(var(--sb) + 14px);display:grid;grid-template-columns:repeat(2,calc(var(--bs)*.92));gap:8px;pointer-events:none}
#tcA .tb{position:relative;width:calc(var(--bs)*.92);height:calc(var(--bs)*.92)}
#tJ{grid-column:1/3;width:100%!important;border-radius:999px!important;height:calc(var(--bs)*1.05)!important;background:rgba(255,138,31,.45)!important;flex-direction:row!important;font-size:clamp(11px,2.8vmin,16px)!important}
#tJ.dn{background:rgba(255,138,31,.85)!important}
#joy{position:absolute;left:calc(var(--sl) + 18px);bottom:calc(var(--sb) + 18px);width:calc(var(--bs)*2.1);height:calc(var(--bs)*2.1);border-radius:50%;background:rgba(8,26,46,.4);border:2px solid rgba(160,220,255,.35);pointer-events:auto;touch-action:none;display:none}
#joyK{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(34,211,255,.55);border:2px solid #fff}
#touch.joym #joy{display:block}#touch.joym #tcS{display:none}#touch.joym #tG{visibility:hidden}
#touch.lefty #tcS{left:auto;right:calc(var(--sr) + 14px)}#touch.lefty #tcA{right:auto;left:calc(var(--sl) + 14px)}#touch.lefty #joy{left:auto;right:calc(var(--sr) + 18px)}
/* screens */
#ui{position:fixed;inset:0;z-index:20;pointer-events:none}
.screen{position:absolute;inset:0;display:none;pointer-events:auto;padding:calc(var(--sa) + 12px) calc(var(--sr) + 14px) calc(var(--sb) + 12px) calc(var(--sl) + 14px);flex-direction:column;background:linear-gradient(180deg,rgba(3,10,20,.78),rgba(3,10,20,.9))}
.screen.on{display:flex;animation:scIn .38s cubic-bezier(.2,.8,.2,1)}
.screen.clear{background:none;pointer-events:none}
.screen.clear *{pointer-events:auto}
@keyframes scIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.sc-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex:none}
.sc-title{font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:2px;font-size:clamp(20px,5vmin,34px);flex:1;background:linear-gradient(90deg,#fff,var(--c1));-webkit-background-clip:text;background-clip:text;color:transparent}
.sc-body{flex:1;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:2px 4px 16px 2px}
.sc-body::-webkit-scrollbar{width:6px}.sc-body::-webkit-scrollbar-thumb{background:var(--ln);border-radius:4px}
.wallet{display:flex;gap:8px;align-items:center;font-weight:800;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--pan2);border:1px solid var(--ln);font-weight:800;font-size:13px;white-space:nowrap}
.chip.on{background:linear-gradient(180deg,var(--c1),#0a8ab0);color:#032;border-color:#fff}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,var(--gold) 55%,#b8860b);vertical-align:-.15em;box-shadow:0 0 0 1px #7a5a00}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;font-size:clamp(12px,2.6vmin,15px);background:linear-gradient(180deg,#235d8f,#12385c);border:1px solid rgba(150,205,255,.45);clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:transform .12s,filter .12s;min-height:42px;white-space:nowrap}
.btn:hover{filter:brightness(1.2)}.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(180deg,#ffa23c,#e26a00);color:#210d00;border-color:#ffd9a8}
.btn.go{background:linear-gradient(180deg,#46f0a0,#10a864);color:#012;border-color:#c6ffe3}
.btn.sm{padding:7px 14px;min-height:32px;font-size:12px}
.btn.dis{filter:grayscale(1) brightness(.6);pointer-events:none}
.btn.back{padding:8px 16px;min-height:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.card{position:relative;background:var(--pan);border:1px solid var(--ln);border-radius:14px;padding:12px;overflow:hidden;text-align:left;transition:transform .15s,border-color .15s;display:block;width:100%}
.card:hover{border-color:var(--c1);transform:translateY(-2px)}
.card.sel{border-color:var(--c2);box-shadow:0 0 0 2px rgba(255,138,31,.45)}
.card.lock{opacity:.78}
.card h3{margin:0 0 4px;font-size:16px;font-weight:900;letter-spacing:.5px}
.card p{margin:0;font-size:12.5px;color:var(--mut);line-height:1.35}
.card .ico{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c1),#0a60a8);display:flex;align-items:center;justify-content:center;margin-bottom:8px;font-size:22px;color:#012}
.card canvas{width:100%;height:auto;border-radius:10px;display:block;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.sp{flex:1}
.lbl{font-size:11px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:1.5px;margin:12px 0 6px}
.bar{height:8px;border-radius:5px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid var(--ln)}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--c1),#8affc1);transition:width .6s}
.bar.or>i{background:linear-gradient(90deg,var(--c2),var(--gold))}
.stars{letter-spacing:2px;color:var(--gold)}
.medal{display:inline-block;width:20px;height:20px;border-radius:50%;border:2px solid rgba(0,0,0,.3);vertical-align:middle;margin-right:2px}
.m0{background:#33424f}.m1{background:radial-gradient(circle at 35% 30%,#f5c49a,var(--bro))}.m2{background:radial-gradient(circle at 35% 30%,#fff,var(--sil))}.m3{background:radial-gradient(circle at 35% 30%,#fff7b0,var(--gold))}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:left}
.tbl th{font-size:11px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.tbl tr.me td{background:rgba(255,138,31,.18);font-weight:900}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;flex:none;touch-action:pan-x}
.sw{display:inline-block;width:26px;height:26px;border-radius:7px;border:2px solid rgba(255,255,255,.5);vertical-align:middle}
.price{font-weight:900;color:var(--gold)}
.tag{display:inline-block;font-size:10px;font-weight:900;letter-spacing:1px;padding:2px 7px;border-radius:5px;background:rgba(34,211,255,.2);color:var(--c1);text-transform:uppercase}
.tag.or{background:rgba(255,138,31,.2);color:var(--c2)}
.tag.g{background:rgba(61,220,132,.2);color:var(--ok)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px;border-bottom:1px solid var(--ln);font-weight:700;font-size:14px}
.set input[type=range]{width:min(42vw,240px);accent-color:var(--c1)}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.pv{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:800}
/* menu */
.menu-wrap{flex:1;display:flex;gap:16px;min-height:0;align-items:stretch}
.menu-left{display:flex;flex-direction:column;justify-content:center;gap:14px;flex:1;min-width:0}
.logo small{display:block;letter-spacing:5px;font-weight:800;color:var(--c1);font-size:clamp(10px,2.3vmin,14px)}
.logo h1{margin:0;font-weight:900;font-style:italic;font-size:clamp(38px,11vmin,92px);line-height:.92;letter-spacing:-1px;text-shadow:0 6px 30px rgba(0,0,0,.55)}
.logo h1 span{background:linear-gradient(180deg,#fff,#6fd8ff 55%,#2a8bd8);-webkit-background-clip:text;background-clip:text;color:transparent;display:block}
.logo h1 em{font-size:.55em;color:var(--c2);margin-left:.15em}
.mlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-width:520px}
.mbtn{display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;font-size:clamp(12px,2.6vmin,16px);background:linear-gradient(90deg,rgba(14,44,76,.85),rgba(14,44,76,.4));border:1px solid var(--ln);border-left:4px solid var(--c1);border-radius:6px;text-align:left;transition:transform .14s,background .14s}
.mbtn:hover{transform:translateX(5px);background:linear-gradient(90deg,rgba(30,90,150,.9),rgba(14,44,76,.5))}
.mbtn.pri{grid-column:1/3;border-left-color:var(--c2);background:linear-gradient(90deg,rgba(226,106,0,.92),rgba(226,106,0,.3));font-size:clamp(16px,3.6vmin,24px);padding:14px}
.mbtn svg.ic{width:1.4em;height:1.4em}
.pcard{width:min(300px,34vw);align-self:flex-start;background:var(--pan);border:1px solid var(--ln);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.lvl{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--c2),#ffd24a);color:#210d00;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;flex:none}
/* splash / loading */
#s-splash{align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 60%,rgba(10,40,80,.15),rgba(2,8,18,.82))}
#s-splash .tap{margin-top:30px;font-weight:900;letter-spacing:4px;color:var(--c1);animation:blink 1s infinite alternate;font-size:clamp(13px,3vmin,18px)}
#s-loading{align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0d2744,#030a14);z-index:30}
.ld{width:min(70vw,420px);margin-top:18px}
.snowflake{width:56px;height:56px;animation:spin 3s linear infinite;color:var(--c1)}
@keyframes spin{to{transform:rotate(360deg)}}
/* results */
.res-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.res-pos{font-size:clamp(46px,12vmin,86px);font-weight:900;font-style:italic;line-height:1;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.res-big{font-size:clamp(24px,6vmin,42px);font-weight:900;font-variant-numeric:tabular-nums}
.rew{display:flex;gap:10px;flex-wrap:wrap}
.rew .chip{font-size:15px;animation:rewIn .6s both}
@keyframes rewIn{from{opacity:0;transform:scale(.5) translateY(20px)}to{opacity:1;transform:none}}
.flyc{position:fixed;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,var(--gold));z-index:70;pointer-events:none;box-shadow:0 0 10px var(--gold)}
.medalbig{width:70px;height:70px;border-radius:50%;border:4px solid rgba(255,255,255,.7);animation:medalIn .9s cubic-bezier(.2,1.6,.4,1) both;display:inline-block}
@keyframes medalIn{from{transform:scale(0) rotate(-180deg)}to{transform:none}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(2,8,18,.78);display:flex;align-items:center;justify-content:center;padding:16px}
.modal>div{background:linear-gradient(180deg,#10304f,#0a1d33);border:1px solid var(--c1);border-radius:16px;padding:18px;max-width:520px;width:100%;max-height:90%;overflow-y:auto;touch-action:pan-y;animation:scIn .3s}
.modal h2{margin:0 0 8px;font-style:italic;text-transform:uppercase;letter-spacing:1px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--sa) + 8px);z-index:80;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:center}
.toast{background:linear-gradient(90deg,#103a63,#0a2342);border:1px solid var(--gold);border-radius:10px;padding:8px 14px;font-weight:800;font-size:13px;animation:toast 3.4s both;display:flex;gap:8px;align-items:center}
@keyframes toast{0%{opacity:0;transform:translateY(-20px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#compat{position:fixed;inset:0;z-index:100;background:#06101c;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;flex-direction:column;gap:10px}
.tut-slide{text-align:center;padding:10px}
.tut-slide h2{font-style:italic;text-transform:uppercase;margin:6px 0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:14px;margin:10px auto;max-width:360px}
kbd{background:#0d2a48;border:1px solid var(--ln);border-bottom-width:3px;border-radius:6px;padding:1px 7px;font-weight:800;font-size:12px}
@media (max-width:760px),(max-height:520px){.pcard{display:none}.menu-wrap{flex-direction:column}.mlist{max-width:none}.mbtn{padding:8px 10px}}
@media (max-height:520px){.logo h1{font-size:clamp(30px,10vh,60px)}.mlist{grid-template-columns:repeat(4,1fr)}.mbtn.pri{grid-column:1/5}.mbtn svg.ic{display:none}}
#s-splash.clear{pointer-events:auto}
.gw{flex:1;display:flex;min-height:0}
.gp{margin-left:auto;width:min(450px,48vw);background:var(--pan);border:1px solid var(--ln);border-radius:14px;padding:12px;display:flex;flex-direction:column;min-height:0;height:100%}
.gp .sc-title{font-size:clamp(16px,3.4vmin,24px)}
